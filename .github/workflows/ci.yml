name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile and test
        run: npm test

      - name: Package the extension
        run: |
          set -o pipefail
          npx vsce package --skip-license --out check-the-maps.vsix 2>&1 | tee vsce.log
          # Surface packaging warnings on the run page.
          grep -i 'warning' vsce.log | while read -r line; do echo "::warning title=vsce::$line"; done || true

      - name: Summarize the package
        run: |
          {
            echo '### check-the-maps.vsix'
            echo
            echo '```'
            unzip -l check-the-maps.vsix
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Packaged files::$(unzip -Z1 check-the-maps.vsix | tr '\n' ' ')"

      - name: Upload the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: check-the-maps-vsix
          path: check-the-maps.vsix
          if-no-files-found: error
